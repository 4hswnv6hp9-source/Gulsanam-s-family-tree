<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xolboboy avlodlari shajarasi</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f6f3ea; --ink:#1f2a1c; --muted:#6b705f; --branch:#8a6238;
  --leaf:#e6f0da; --leaf-ink:#1d3319; --root:#5b3a1e; --root-ink:#fff4e0;
  --d1:#2f6b2f; --d2:#5a8f2a; --d3:#a2a82c; --d4:#c58a2a; --btn:#e1d8c3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15190f; --ink:#e8efdc; --muted:#9aa58a; --branch:#a77b4a;
    --leaf:#22301c; --leaf-ink:#dcebd0; --root:#7a4f27; --root-ink:#fff4e0;
    --d1:#6fbf6f; --d2:#9acb52; --d3:#d2d45a; --d4:#e8ac4a; --btn:#2c3322;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,"Times New Roman",serif;
  padding:env(safe-area-inset-top,0px) 14px calc(env(safe-area-inset-bottom,0px) + 24px)}
header{padding:22px 0 10px;max-width:760px;margin:0 auto}
h1{font-size:1.55rem;line-height:1.2;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:.9rem;color:var(--ink);background:var(--btn);border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
button:focus-visible,.node:focus-visible{outline:3px solid var(--d1);outline-offset:2px}
.wrap{max-width:760px;margin:12px auto 0;overflow-x:auto;padding-bottom:12px}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:12px}
.tree li{position:relative;padding:4px 0 4px 22px}
.tree li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--branch)}
.tree li::after{content:"";position:absolute;left:0;top:19px;width:18px;border-top:2px solid var(--branch)}
.tree li:last-child::before{bottom:auto;height:20px}
.tree>li{padding-left:0}
.tree>li::before,.tree>li::after{display:none}
.node{display:inline-flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:var(--leaf);color:var(--leaf-ink);
  border-radius:16px 4px 16px 4px;border-left:5px solid var(--d1);padding:6px 12px;cursor:default;max-width:100%}
.d2>.node{border-left-color:var(--d2)} .d3>.node{border-left-color:var(--d3)} .d4>.node{border-left-color:var(--d4)}
.root>.node{background:var(--root);color:var(--root-ink);border-left-color:var(--branch);border-radius:20px 6px 20px 6px;padding:10px 16px;font-size:1.1rem}
.has>.node{cursor:pointer}
.nm{font-weight:700}
.yr{font-size:.85rem;opacity:.75}
.cnt{font-size:.78rem;background:var(--d1);color:#fff;border-radius:99px;padding:1px 8px}
.has>.node::before{content:"▾";font-size:.8rem}
.closed>.node::before{content:"▸"}
.closed>ul{display:none}
.note{display:block;width:100%;font-size:.8rem;font-style:italic;opacity:.8}
@media (prefers-reduced-motion:no-preference){.has>ul{animation:in .18s ease-out}}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <h1>🌳 Xolboboy avlodlari shajarasi</h1>
  <p class="sub" id="stats"></p>
  <div class="bar">
    <button id="openAll">Hammasini ochish</button>
    <button id="closeAll">Yig‘ish</button>
  </div>
</header>
<div class="wrap"><ul class="tree" id="tree"></ul></div>

<script>
/* Yangi avlod qo‘shish: kerakli odamning c:[ ... ] ro‘yxatiga {n:"Ism", y:yil} qo‘shing.
   n = ism, y = tug‘ilgan yil, c = farzandlari, note = izoh */
const T = {n:"Xolboboy", y:"1210–1300", c:[
 {n:"Dursun", y:1845, c:[
   {n:"Oysha", y:1870},{n:"Husayin", y:1875},{n:"Meryam", y:1880},{n:"Tesha", y:1886}]},
 {n:"Bõri", y:1847, note:"farzandlari haqida ma’lumot topilmadi"},
 {n:"Sobir", y:1850, note:"10 ta farzandidan 6 tasi ma’lum", c:[
   {n:"Nortoji", y:1938, note:"farzandlari haqida ma’lumot topilmadi"},
   {n:"Shodi", y:1941, c:[
     {n:"Xalim", y:1960, c:[
       {n:"Gulnoz", y:1980},{n:"Ziyadulla", y:1982},{n:"Rano", y:1983},
       {n:"Ilxom", y:1985},{n:"Ikrom", y:1986},{n:"Akrom", y:1988}]},
     {n:"Jõra", y:1965, c:[
       {n:"G‘ulom", y:1988},{n:"Sabo", y:1990},{n:"Feruza", y:1992},{n:"Oxun", y:1998}]},
     {n:"Tõra", y:1967, c:[
       {n:"Akmal", y:1986},{n:"Anvar", y:1988}]},
     {n:"Chori", y:1968, c:[
       {n:"Shokir", y:1980},{n:"Motabar", y:1983},{n:"Zokir", y:1985},{n:"Zarif", y:1986},
       {n:"Sharif", y:1987},{n:"G‘opir", y:1988},{n:"Farrux", y:1997}]},
     {n:"Ashur", y:1970, c:[
       {n:"Akbar", y:1992},{n:"Abror", y:1994},{n:"Dilshod", y:1997},{n:"Umida", y:2003},{n:"Gulsanam", y:2008}]},
     {n:"Qurbongul", y:1972, c:[
       {n:"Nigora", y:1992},{n:"Umida", y:1998},{n:"Parvina", y:2005},{n:"Azizbek", y:2007}]}]},
   {n:"Oyimxol", y:1945, c:[
     {n:"Xalma", y:1970},{n:"Nappi", y:1972},{n:"Oytugan", y:1975},{n:"Nargiz", y:1980}]},
   {n:"Muxtor", y:1950},
   {n:"Oynisa", y:1980},
   {n:"Botir", y:1987}]},
 {n:"Oytugan", y:1855},
 {n:"Muxtor", y:1860},
 {n:"Maysara", y:1870}
]};

const count = n => 1 + (n.c||[]).reduce((s,x)=>s+count(x),0);
const depth = n => 1 + Math.max(0,...(n.c||[]).map(depth));

function build(n, d){
  const li = document.createElement("li");
  const has = n.c && n.c.length;
  li.className = (d===0?"root ":"") + "d"+Math.min(d,4) + (has?" has":"");
  const node = document.createElement("div");
  node.className = "node";
  node.innerHTML = '<span class="nm"></span><span class="yr"></span>' + (has?'<span class="cnt"></span>':'') + (n.note?'<span class="note"></span>':'');
  node.querySelector(".nm").textContent = n.n;
  node.querySelector(".yr").textContent = n.y;
  if(has) node.querySelector(".cnt").textContent = n.c.length;
  if(n.note) node.querySelector(".note").textContent = n.note;
  li.appendChild(node);
  if(has){
    node.tabIndex = 0;
    node.setAttribute("role","button");
    const ul = document.createElement("ul");
    n.c.forEach(c => ul.appendChild(build(c, d+1)));
    li.appendChild(ul);
    const toggle = () => li.classList.toggle("closed");
    node.addEventListener("click", toggle);
    node.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); }});
  }
  return li;
}

document.getElementById("tree").appendChild(build(T,0));
document.getElementById("stats").textContent = count(T) + " kishi · " + depth(T) + " avlod";
const all = () => document.querySelectorAll("#tree li.has");
document.getElementById("openAll").onclick = () => all().forEach(l => l.classList.remove("closed"));
document.getElementById("closeAll").onclick = () => all().forEach((l,i) => l.classList.toggle("closed", i>0));
</script>
</body>
</html>
